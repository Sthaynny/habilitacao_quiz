name: habilitacao_quiz
description: Um projeto para ajudar as pessoas que querem tirar sua CNH.
version: 1.9.4+39

environment:
  sdk: ">=3.12.2 <4.0.0"

dependencies:
  cupertino_icons: ^1.0.9
  dartz: ^0.10.1
  flutter:
    sdk: flutter
  get: ^4.7.3
  google_fonts: ^8.2.0
  # Última estável compatível com file_picker 11 (win32 ^5). share_plus 13 exige win32 ^6.
  share_plus: ^12.0.2
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  # Última estável no pub.dev (12.x só em beta — não usar). AGP 8+: namespace no plugin Android.
  file_picker: ^11.0.2
  url_launcher: ^6.3.2
  flutter_markdown_plus: ^1.0.12

dev_dependencies:
  # 2.15.2 exige analyzer incompatível com o meta fixado pelo Flutter SDK 3.44.
  build_runner: ^2.15.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mockito: ^5.7.0

flutter:
  uses-material-design: true

  assets:
    - assets/imagens/
    - assets/json/
    - assets/learning/
    - assets/learning/temas/
    - assets/learning/temas/legislacao/
    - assets/learning/temas/direcao_defensiva/
    - assets/learning/temas/mecanica_basica/
    - assets/learning/temas/primeiros_socorros/
    - assets/learning/temas/meio_ambiente/
    - assets/learning/fichas/
